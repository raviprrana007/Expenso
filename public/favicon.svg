<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="50%" stop-color="#0b0e17"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>

    <!-- Bezel Rim -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#a855f7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1e1b4b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Vibrant Emblem Gradient -->
    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="30%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Chrome Specular Gradient -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#cbd5e1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28" result="blur"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="256" cy="256" r="180" fill="#6366f1" opacity="0.18" filter="url(#softGlow)"/>
  <circle cx="340" cy="200" r="100" fill="#a855f7" opacity="0.22" filter="url(#softGlow)"/>
  <circle cx="180" cy="320" r="100" fill="#06b6d4" opacity="0.15" filter="url(#softGlow)"/>

  <!-- Squircle Base Canvas -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="6"/>
  <!-- Inner Rim Highlight -->
  <rect x="28" y="28" width="456" height="456" rx="104" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Outer Protective Shield -->
  <path d="M256 96 L384 152 V272 C384 344 328 402 256 428 C184 402 128 344 128 272 V152 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#emblemGrad)" 
        stroke-width="4" 
        stroke-linejoin="round"
        opacity="0.9"/>

  <!-- Faceted Geometric Prisms -->
  <path d="M304 120 L370 180 L320 330 L270 240 Z" fill="#818cf8" opacity="0.2" />
  <path d="M140 260 L210 170 L260 270 L170 340 Z" fill="#a855f7" opacity="0.18" />

  <!-- The "E" Dynamic Monogram / Modern Financial Prisms -->
  <!-- Upper Arm -->
  <path d="M192 196 H332 C345 196 354 207 350 220 L342 244 C339 252 331 258 322 258 H254 L238 298 H312 C325 298 334 309 330 322 L322 346 C319 354 311 360 302 360 H182 C168 360 158 346 163 333 L210 184 C214 172 225 164 238 164 H340 C353 164 362 175 358 188 L354 196 H234 Z" 
        fill="url(#emblemGrad)" 
        filter="url(#neonGlow)"/>

  <!-- Specular High-Gloss Bevel Layer -->
  <path d="M194 198 H330 L320 230 H250 L234 270 H310 L300 302 H180 L168 340 L212 186 H338" 
        stroke="url(#chromeGrad)" 
        stroke-width="3" 
        stroke-linecap="round"
        fill="none" 
        opacity="0.75"/>

  <!-- Central Energy Core Spark -->
  <circle cx="286" cy="278" r="6" fill="#ffffff" filter="url(#neonGlow)"/>
</svg>
