<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="alternate icon" type="image/png" href="/app-icon.png" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0e16" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <title>Expenso - Smart Personal & Shared Expense Tracking</title>
    <meta name="description" content="Expenso - Local-first personal expense tracking, monthly budget rollover, shared group splits, Owes & Dues manager, and annual PDF reports." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('expenso_settings_v1') || '{}');
          var light = s.theme === 'light';
          document.documentElement.classList.toggle('light', light);
          document.documentElement.classList.toggle('dark', !light);
          document.documentElement.style.colorScheme = light ? 'light' : 'dark';
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-indigo-500/40">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
